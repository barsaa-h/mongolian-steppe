<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Winter Sunset Camp — Character Detail Test · Mongolian Steppe Low-Poly</title>
<style>
  :root {
    --ink: #f4e9df;
    --muted: #d5b6ae;
    --frame: rgba(255, 220, 205, 0.14);
    --stage-w: min(96vw, 138vh);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(ellipse at 50% 42%, #24162c 0%, #100a16 55%, #07050a 100%);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  body {
    display: grid;
    place-items: center;
    min-height: 100svh;
  }
  .stage {
    position: relative;
    width: var(--stage-w);
    aspect-ratio: 3 / 2;
    max-height: 92svh;
    overflow: hidden;
    border: 1px solid var(--frame);
    box-shadow:
      0 36px 90px rgba(0, 0, 0, 0.62),
      0 0 0 1px rgba(0, 0, 0, 0.35) inset;
    background: #2a1b35;
    isolation: isolate;
  }
  .stage canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;
  }
  .stage.free canvas { cursor: grab; }
  .stage.free canvas:active { cursor: grabbing; }
  .view-toggle {
    position: absolute;
    top: clamp(14px, 2.4vw, 30px);
    right: clamp(14px, 2.4vw, 30px);
    z-index: 3;
    pointer-events: auto;
    appearance: none;
    border: 1px solid rgba(255, 220, 205, 0.26);
    background: rgba(24, 13, 30, 0.44);
    color: rgba(255, 232, 220, 0.82);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: clamp(8px, 0.72vw, 10px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 0.6em 0.85em;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
  }
  .view-toggle:hover {
    background: rgba(48, 26, 48, 0.68);
    border-color: rgba(255, 220, 205, 0.5);
    color: #fff2e6;
  }
  .quality-toggle {
    top: calc(clamp(14px, 2.4vw, 30px) + 2.8em);
    opacity: 0.72;
  }
  .quality-toggle:hover { opacity: 1; }
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 44%, transparent 52%, rgba(16, 8, 22, 0.18) 100%),
      linear-gradient(to bottom, rgba(18, 8, 26, 0.08), transparent 18%, transparent 82%, rgba(18, 8, 26, 0.1));
    mix-blend-mode: multiply;
  }
  .ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(14px, 2.4vw, 30px);
  }
  .eyebrow {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: clamp(7px, 0.72vw, 10px);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255, 219, 205, 0.8);
    margin-bottom: 0.55em;
    text-shadow: 0 1px 10px rgba(30, 10, 30, 0.85);
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(18px, 2.35vw, 36px);
    letter-spacing: 0.035em;
    color: rgba(255, 242, 232, 0.94);
    text-shadow: 0 2px 18px rgba(32, 10, 30, 0.7);
  }
  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
  }
  .palette {
    display: flex;
    gap: 5px;
    opacity: 0.8;
  }
  .palette i {
    display: block;
    width: clamp(8px, 0.9vw, 12px);
    height: clamp(8px, 0.9vw, 12px);
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(255, 235, 220, 0.16);
  }
  .hint {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: clamp(8px, 0.78vw, 11px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 224, 210, 0.5);
    text-shadow: 0 1px 8px rgba(30, 10, 30, 0.8);
    white-space: nowrap;
  }
  #loader {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #170e21;
    z-index: 5;
    transition: opacity 900ms ease;
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255, 208, 185, 0.72);
  }
  body.ready #loader { opacity: 0; pointer-events: none; }
  @media (max-width: 720px) {
    :root { --stage-w: 100vw; }
    .stage { max-height: 100svh; border-left: 0; border-right: 0; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="ui">
      <header>
        <div class="eyebrow">Mongolian steppe · character detail test</div>
        <h1>Winter Sunset Camp</h1>
      </header>
      <div class="footer">
        <div class="palette" aria-hidden="true">
          <i style="background:#81526f"></i>
          <i style="background:#c16a75"></i>
          <i style="background:#f08473"></i>
          <i style="background:#b7b0dc"></i>
          <i style="background:#847ba1"></i>
          <i style="background:#5c5c86"></i>
          <i style="background:#ffb05a"></i>
        </div>
        <div class="hint">Detail pass · 60-second camp story · Drag to orbit</div>
      </div>
    </div>
    <button class="view-toggle" id="view-toggle" type="button">Free look</button>
    <button class="view-toggle quality-toggle" id="quality-toggle" type="button">Quality: High</button>
    <div class="vignette"></div>
    <div id="loader">Lighting the fire</div>
  </main>
