<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>НАРАН ХОРООЛОЛ — PSX</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a12;
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: #d8d0c0;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud {
      position: fixed;
      left: 12px;
      bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #000;
      opacity: 0.85;
      pointer-events: none;
      user-select: none;
    }
    #title {
      position: fixed;
      right: 16px;
      top: 12px;
      text-align: right;
      text-shadow: 2px 2px 0 #000;
      user-select: none;
      pointer-events: none;
    }
    #title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 3px;
    }
    #title small {
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0.7;
    }
    #watchFilm { position: fixed; top: 65px; right: 16px; padding: 9px 12px; border: 1px solid #a69b86; color: #e8dcc5; background: #111720cc; text-decoration: none; font-size: 12px; letter-spacing: 1px; }
    #watchFilm:focus-visible { outline: 2px solid #e7ba74; outline-offset: 3px; }
    #bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 4px;
      height: 3px;
      background: rgba(255,255,255,0.12);
      pointer-events: none;
    }
    #barFill {
      height: 100%;
      width: 0%;
      background: #e8a33d;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="title">
    <h1>НАРАН ХОРООЛОЛ</h1>
    <small>AUTUMN 1998 // МОНГОЛ &nbsp;·&nbsp; <span id="viewName">OVERVIEW</span></small>
  </div>
  <a id="watchFilm" href="film.html">▶ ХАНИАД · 30s FILM</a>
  <div id="hud">
    <div id="hudMap">
      ENTER: BECOME THE HERDER &nbsp; DRAG: ORBIT &nbsp; WHEEL: ZOOM<br />
      1-8: VIEWS &nbsp; A: AUTO-ORBIT &nbsp; [ ]: DAY &nbsp; SPACE: DAY CYCLE
    </div>
    <div id="hudPlay" hidden>
      WASD: RUN &nbsp; SHIFT: SPRINT &nbsp; F: FLY &nbsp; SPACE / CTRL: RISE / FALL<br />
      DRAG: LOOK &nbsp; WHEEL: DISTANCE &nbsp; ESC: BACK TO THE MAP
    </div>
  </div>
  <div id="bar"><div id="barFill"></div></div>
  <script src="dist/bundle.js"></script>
</body>
</html>
