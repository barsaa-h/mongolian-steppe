<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>НАРАН ХОРООЛОЛ — PSX</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a12;
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: #d8d0c0;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud {
      position: fixed;
      left: 12px;
      bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #000;
      opacity: 0.85;
      pointer-events: none;
      user-select: none;
    }
    #title {
      position: fixed;
      right: 16px;
      top: 12px;
      text-align: right;
      text-shadow: 2px 2px 0 #000;
      user-select: none;
      pointer-events: none;
    }
    #title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 3px;
    }
    #title small {
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0.7;
    }
    #bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 4px;
      height: 3px;
      background: rgba(255,255,255,0.12);
      pointer-events: none;
    }
    #barFill {
      height: 100%;
      width: 0%;
      background: #e8a33d;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="title">
    <h1>НАРАН ХОРООЛОЛ</h1>
    <small>SMALL TOWN // МОНГОЛ '98 &nbsp;·&nbsp; <span id="viewName">OVERVIEW</span></small>
  </div>
  <div id="hud">
    DRAG: ORBIT &nbsp; WHEEL: ZOOM &nbsp; A: AUTO-ORBIT<br />
    1-5: VIEWS &nbsp; &larr; &rarr;: SCRUB DAY &nbsp; SPACE: PAUSE
  </div>
  <div id="bar"><div id="barFill"></div></div>
  <script src="dist/bundle.js"></script>
</body>
</html>
